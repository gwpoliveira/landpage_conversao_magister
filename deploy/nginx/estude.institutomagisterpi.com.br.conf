# ==============================================================================
# NGINX CONFIGURATION - INSTITUTO MAGISTER DE ENSINO
# Domínio: estude.institutomagisterpi.com.br
# Porta da Aplicação Next.js (PM2): 3020
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name estude.institutomagisterpi.com.br;

    # Bloqueio de arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cabeçalhos de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache de estáticos do Next.js
    location /_next/static/ {
        alias /var/www/estude.institutomagisterpi.com.br/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache de assets públicos (imagens, favicon, logos)
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif)$ {
        root /var/www/estude.institutomagisterpi.com.br/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @nextjs;
    }

    # Proxy reverso para o Next.js (porta 3020)
    location / {
        try_files $uri @nextjs;
    }

    location @nextjs {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
